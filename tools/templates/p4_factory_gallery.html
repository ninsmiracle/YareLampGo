<!doctype html><html lang="zh"><meta charset="utf-8"><title>LampGo · 眼嘴一起有表情</title>
<style>body{margin:0;background:#0a111a;color:#efeee7;font:16px system-ui}main{max-width:1400px;margin:auto;padding:36px}h1{font-size:38px;margin:8px 0}p{color:#a4b5bf;line-height:1.7}.bar{position:sticky;top:0;background:#0a111af0;padding:16px 0;display:flex;gap:20px;align-items:center;z-index:3}button{background:#badacc;color:#132b27;border:0;border-radius:24px;padding:10px 22px;cursor:pointer}input{flex:1}#grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px}article{background:#111c27;border:1px solid #263740;border-radius:24px;padding:18px}canvas{width:100%;border-radius:18px;background:#000}h2{font-size:20px;margin:16px 0 4px}.tag{font-size:12px;color:#91baa9;min-height:18px}.desc{font-size:14px;min-height:46px}small{color:#93a9b5}table{border-collapse:collapse;width:100%;margin:24px 0}td,th{text-align:left;padding:14px;border-bottom:1px solid #263740}a{color:#b4ded0}</style>
<main><small>LAMPGO / P4 FACTORY FACES / 01</small><h1>眼睛有想法，嘴角有回应。</h1><p>14 组眼嘴表情，共用 3 秒时间轴。以下像素来自实际 C++ 固件渲染器。<br>软件预览已生成；尚未刷机，屏幕色彩、亮度与同步观感以实机验收为准。</p>
<div class="bar"><button id="toggle">暂停</button><input id="scrub" type="range" min="0" max="2999" value="0"><span id="time">0.0 / 3.0 秒</span></div><section id="grid"></section>
<h2>出厂录制动作 · 情绪配对</h2><p>动作文件保持原样；已有用户绑定优先。眼嘴共用设备时钟，动作启动走既有播放接口，尚不宣称舵机关键帧级同步。</p><table><thead><tr><th>录制动作</th><th>眼嘴表情</th><th>设计意图</th></tr></thead><tbody id="recordings"></tbody></table>
<p>新出厂动画不占 LittleFS 素材配额。新增上传配额：16 个眼睛 × 256 KiB，24 个嘴巴 × 8 KiB。完整存储与验收说明见交付报告。</p></main>
<script>const data=DATA;const cards=[];const decode=(s)=>Uint8Array.from(atob(s),x=>x.charCodeAt(0));
for(const face of data.faces){const a=document.createElement('article');const bindings=Object.entries(data.recordings).filter(x=>x[1]===face.id).map(x=>x[0]);a.innerHTML=`<canvas width="320" height="172" class="eyes"></canvas><canvas width="432" height="80" class="mouth"></canvas><h2>${face.label}</h2><p class="desc">${face.description}</p><div class="tag">${bindings.join(' · ')||'自由组合 / 日常陪伴'}</div>`;document.querySelector('#grid').append(a);const image=new Image();image.src=face.id+'.png';const clip=data.atlas.effects[face.id];cards.push({image,eyes:a.querySelector('.eyes').getContext('2d'),mouth:a.querySelector('.mouth').getContext('2d'),clip,frames:clip.frames.map(decode)});}
for(const [name,id] of Object.entries(data.recordings)){const f=data.faces.find(x=>x.id===id);document.querySelector('#recordings').insertAdjacentHTML('beforeend',`<tr><td>${name}</td><td>${f.label}</td><td>${f.description}</td></tr>`)}
let playing=true,base=performance.now(),hold=0;const slider=document.querySelector('#scrub');document.querySelector('#toggle').onclick=()=>{playing=!playing;if(playing)base=performance.now()-hold;document.querySelector('#toggle').textContent=playing?'暂停':'播放'};slider.oninput=()=>{hold=+slider.value;base=performance.now()-hold};
function tick(now){const ms=playing?Math.max(0,now-base)%3000:hold;hold=ms;slider.value=ms;document.querySelector('#time').textContent=(ms/1000).toFixed(1)+' / 3.0 秒';for(const c of cards){let f=Math.floor(ms/50);c.eyes.fillStyle='#000';c.eyes.fillRect(0,0,320,172);if(c.image.complete&&c.image.naturalWidth)c.eyes.drawImage(c.image,f%10*320,Math.floor(f/10)*172,320,172,0,0,320,172);const px=c.frames[c.clip.timeline[Math.floor(ms/100)]];c.mouth.fillStyle='#111c27';c.mouth.fillRect(0,0,432,80);for(let n=0;n<486;n++){let col=c.clip.palette[px[n]][0];c.mouth.fillStyle=col==='#000000'?'#26333c':col;c.mouth.beginPath();c.mouth.arc(n%54*8+4,Math.floor(n/54)*8+7,2.7,0,Math.PI*2);c.mouth.fill()}}requestAnimationFrame(tick)}requestAnimationFrame(tick);</script></html>
